ome":"VP-A","image":"assets/G6-fender-twin-reverb-hero-01.webp","size":[1536,1024]},"a-amp-svt":{"name":"Ampeg SVT bass amplifier","home":"VP-A","image":"assets/G6-ampeg-svt-hero-01.webp","size":[1536,1024]},"c-radio":{"name":"Radio","home":"VP-C","image":"assets/G9-story-off-01.webp","size":[1535,1024]},"c-bookshelf":{"name":"Magazine shelf","home":"VP-C"},"c-boombox-jvc":{"name":"JVC RC-M90 boombox","home":"VP-C","image":"assets/G6-jvc-rc-m90-hero-01.webp","size":[1536,1024]},"c-boombox-sharp":{"name":"Sharp GF-777 boombox","home":"VP-C","image":"assets/G6-sharp-gf-777-hero-01.webp","size":[1536,1024]},"c-walkman":{"name":"Sony Walkman TPS-L2 player","home":"VP-C","image":"assets/G6-sony-tps-l2-hero-01.webp","size":[1536,1024]},"c-cartridges":{"name":"Game cartridges","home":"VP-C"}},"stories":[{"name":"Cassettes","short":"Tapes","pages":[{"title":"Bruce Springsteen — Nebraska (cassette)","maker":"Columbia, USA · 1982","year":"","tagline":"A rock star’s home demo on a four-track cassette, released almost exactly as it was recorded.","story":["In the winter of 1981 Bruce Springsteen sent his guitar technician out for a simple tape recorder. Between 17 December 1981 and 3 January 1982 he recorded new songs alone in the bedroom of his house in Colts Neck, New Jersey, on a TEAC 144 Portastudio four-track cassette machine with two Shure SM57 microphones.","The tapes were meant as demos for the E Street Band. He carried the cassette around in his jeans pocket, unsure what to do with it. The band versions did not capture the spirit of the demos, so the acoustic recordings were released as they were. Getting them onto vinyl took about two months of work before the final master was cut at Atlantic Studios in New York.","Columbia released Nebraska on 30 September 1982. Springsteen gave no interviews and did not tour behind it, yet it reached number three in the US and the UK and went platinum by 1989. This copy is the original American cassette, catalogue number TCT 38358."],"cas":0,"img":"assets/cas/ins-front.webp"},{"title":"Pearl Jam — Ten (cassette)","maker":"Epic Associated, USA · 1991","year":"","tagline":"Pearl Jam’s debut, born from a demo cassette passed between Seattle and San Diego.","story":["Pearl Jam began with a tape. After Mother Love Bone ended with the death of singer Andrew Wood in 1990, Stone Gossard, Jeff Ament and Mike McCready recorded instrumental demos and circulated a cassette called Stone Gossard Demos ’91, hoping to find a singer and a drummer. In September 1990 Eddie Vedder, a musician in San Diego, got a copy from drummer Jack Irons. He listened, went surfing, and the next day wrote lyrics for three of the songs. Two of them became “Alive” and “Once”.","Vedder flew to Seattle in October and rehearsed with the band for a week, writing eleven songs. Still called Mookie Blaylock, after the basketball player, they recorded the album at London Bridge Studios in Seattle with producer Rick Parashar in the spring of 1991, and Tim Palmer mixed it in June at Ridge Farm Studio in England. The band became Pearl Jam after signing to Epic, and named the album after Blaylock’s jersey number: ten.","Ten came out on 27 August 1991 and sold slowly at first. The band toured relentlessly, and by late 1992 the album had reached number two on the Billboard 200. By February 1993 it had outsold Nirvana’s Nevermind in the United States, and it is now certified 13 times platinum. This copy is the original American cassette, Epic Associated ZT 47857, in a fully clear case."],"cas":1,"img":"assets/cas/ins-front-ten.webp"},{"title":"Maxell XLII-S 90","maker":"Maxell, Japan · around 1982–83","year":"","tagline":"Maxell’s step-up high-bias tape of the early 1980s in a bronze-gold card, which the maker said beat its own UD-XLII.","story":["Maxell began as a battery maker: the name is short for “maximum capacity dry cell”. It started in Japan around 1960–61 as the battery and magnetic tape side of Nitto Electric, and soon became Hitachi Maxell. In 1979 its US arm launched an advert that Sound & Vision called the most iconic audio ad ever: the “Blown Away Guy”, a man in an armchair being blown back by the sound of a JBL speaker. The photo was taken by Steve Steigman for the agency Scali, McCabe, Sloves.","UD-XLII was Maxell’s high-bias (Type II) tape; XLII-S was sold as a step above it. A collectors’ catalogue lists the first XLII-S around 1980 in a black card marked “High Epitaxial”; its back promised 2 dB more at high frequencies than Maxell’s UD-XLII and a new “Quin-Lok” clamp and hub. This copy is the next version, “Super Fine Epitaxial”, in a bronze-gold card. Its back says the new particles raise maximum output level and sensitivity by 1 dB across the whole frequency range and cut bias noise by 0.5 dB, again against UD-XLII, and introduces the PA (Phase Accuracy) mechanism: an EP (Exact Pressure) pad, an HP (Hexagonal Pattern) sheet and a two-piece hub.","It is the American issue, made in Japan, with Maxell Corporation of America of Moonachie, New Jersey, named on the back: “POSITION HIGH” on the front, 45 minutes a side, 135 m of tape. A collectors’ catalogue dates this US package to 1982–83. In the showcase it sits next to the TDK SA-X: two rival Japanese tapes of the same years, the blank cassettes you would have bought to record an album, a radio show or a mix for a friend."],"cas":2,"img":"assets/cas/ins-front-xlii-s.webp"},{"title":"TDK SA-X90","maker":"TDK, Japan · around 1982","year":"","tagline":"TDK’s flagship high-bias tape of the early 1980s: two layers of magnetic powder on one tape, sold in Japan in black and gold.","story":["TDK began in Tokyo in 1935 as Tokyo Denki Kagaku Kogyo, a company set up to make ferrite, a magnetic material newly invented at the Tokyo Institute of Technology. It went on to make the first Japanese cassette tape, and in TDK’s own words the brand became a household name around the world; the company says its SD cassette even flew on Apollo 11. In 1973 TDK announced Avilyn, a new magnetic particle, and in 1975 an improved version went into a music cassette called SA, which TDK described as the world’s first high-bias cassette made without chrome.","SA-X was the step above SA. Instead of one magnetic layer, the tape carries two layers of two kinds of Avilyn with different magnetic properties, as the back of this J-card explains in Japanese: the card promises a higher maximum output level than SA and low noise, and a small graph on it shows the SA-X curve running above SA. The shell uses TDK’s SP (Super Precision) mechanism with its own dual-spring pad, which the front of the card advertises as “Super Precision Cassette Mechanism”. Sources disagree on when SA-X first appeared: a TDK company portrait published in Audio magazine in 1984 says 1981, while a collectors’ catalogue lists a Japanese SA-X C90 as early as 1979.","In 1982 TDK advertised its reformulated Professional Reference tapes (MA-R, SA-X and AD-X) in the US in bold new packaging. This copy is a Japanese SA-X90 that a collectors’ catalogue dates to 1982: a black card with a gold grid, “High Position” for decks with a tape selector, 45 minutes a side. Its back still carries the name Tokyo Denki Kagaku Kogyo; the company changed its name to TDK in 1983, so the card was most likely printed before that. In the showcase it is the blank tape you would have bought to record your favourite album, or a friend’s."],"cas":3,"img":"assets/cas/ins-front-sa-x.webp"}]},{"name":"Vinyl","short":"Vinyl","pages":[{"title":"Bruce Springsteen — Born to Run (LP)","maker":"Columbia, USA · 1975","year":"","tagline":"The third-album gamble that made Bruce Springsteen a star: eight songs, two studios and a cover Columbia paid double for.","story":["Bruce Springsteen’s first two albums for Columbia were praised but did not sell, and a third failure could have ended his contract. He spent months chasing one big sound. The title song was recorded at 914 Sound Studios in Blauvelt, New York; the other seven were recorded, mixed and mastered at the Record Plant in Manhattan, as the back of the jacket says. The work took so long that, as Springsteen remembers, radio stations had “Born to Run” months before the album was finished.","For the cover, photographer Eric Meola shot some 900 frames in one day; the picture that stuck was Springsteen grinning and leaning on saxophonist Clarence Clemons. Art director John Berg wanted it to wrap from the front onto the back, which meant a gatefold jacket. A plain jacket cost 25 cents to make and a gatefold 50 cents, and Columbia normally kept gatefolds for double albums: Berg recalls a week of negotiating.","Released in late August 1975 at a $6.98 list price, the album went gold within weeks, reached number three in the US in October, and that same month Springsteen was on the covers of Time and Newsweek. It is now seven times platinum and in the Library of Congress National Recording Registry. This copy is an original 1975 PC 33795 from the Santa Maria plant, whose jacket already spells “Jon Landau” correctly: the very first jackets had misspelled the co-producer’s name."],"go":"a-vinyl-rows","where":"audio wall","img":"assets/vin/ins-front-btr.webp"},{"title":"Nirvana — Nevermind (LP)","maker":"DGC, European edition · 1991","year":"","tagline":"A Seattle trio’s major-label debut that knocked Michael Jackson off number one: twelve songs, one month at Sound City and a baby chasing a dollar.","story":["For Nevermind, their album for Geffen’s DGC, Kurt Cobain, Krist Novoselic and Dave Grohl went to Sound City Studios in Van Nuys, California, with producer Butch Vig. They spent a little over a month there recording and mixing; the original budget, according to Mental Floss, was $65,000. Vig remembers the band living in a chaotic apartment, staying out at Venice Beach until dawn and wandering into the studio around four in the afternoon. Andy Wallace mixed the record at Scream in Studio City and Howie Weinberg mastered it at Masterdisk in New York.","The cover idea, a baby underwater going after money, came from Cobain and Geffen art director Robert Fisher. Rather than pay to license a stock picture, the label hired photographer Kirk Weddle, who shot in a pool in Pasadena: and photographed the four-month-old son of friends, who had never been in water before, with a camera on a tripod under the water. The dollar bill on a fishing hook was added to the picture afterwards. “The bill makes the shot,” Weddle said later.","Nevermind came out in the US on 24 September 1991 and entered the Billboard 200 at number 144. On the strength of “Smells Like Teen Spirit” it went gold and platinum on the same day, 27 November 1991, and on the chart of 11 January 1992 it reached number one, replacing Michael Jackson’s Dangerous. It is now certified 13 times platinum by the RIAA and is in the Library of Congress National Recording Registry. This copy is a 1991 European pressing, pressed in Haarlem and sold with a printed inner sleeve whose monkey picture is upside down."],"go":"a-vinyl-rows","where":"audio wall","img":"assets/vin/ins-front-nvm.webp"}]},{"name":"Console","short":"Console","pages":[{"title":"Nakamichi Dragon","maker":"Nakamichi, Japan · 1982–1993","year":"","tagline":"The cassette deck that listens to your tape and turns its own head to match it.","story":["In November 1982 Nakamichi put a new flagship on sale in North America at $1,850. It was the Dragon, a three-head deck and the company’s first that could play a tape in both directions without flipping it.","Auto-reverse had a weakness: a tape recorded on another machine rarely lines up perfectly with the playback head, and the treble suffers. The Dragon fixed this with NAAC, Nakamichi Auto Azimuth Correction. While the tape plays, a small motor tilts the playback head until the two halves of the signal agree. The direction arrows above the window blink while it works.","Reviewers called it the finest cassette deck they had tested, and it became the reference for everyone else. The name was coined by founder Etsuro Nakamichi, who died the month it launched. The original Dragon stayed in production until 1993."],"go":"b-cassette-deck","where":"console","img":"assets/G6-nakamichi-dragon-hero-01.webp"},{"title":"TEAC 144 Portastudio","maker":"TEAC / TASCAM, Tokyo · 1979","year":"","tagline":"A four-track studio in one box: a mixer and an ordinary cassette, and a whole song could be built at home, layer by layer.","story":["Until the late 1970s, recording one part over another meant a studio or a bulky reel-to-reel machine. On 22 September 1979, at the AES convention in New York, TEAC’s professional line TASCAM showed the 144 Portastudio, which it calls the world’s first four-track cassette recorder. A four-channel mixer and a cassette deck shared one case weighing about 9 kg (20 lb): you could record a guitar, then a vocal on the next track, then a third and fourth part, and mix them down to stereo, all without getting out of bed.","The trick was the tape. The 144 ran an ordinary cassette at twice the normal speed and used the full width of the tape for four tracks, so a cassette played in one direction only. TASCAM recalls the first plans being sketched on a restaurant napkin, and the price in its own history is $899; a 1979 suggested retail price of $1,100 is quoted elsewhere.","At the end of 1981 Bruce Springsteen sent his guitar technician to find “a little tape machine” for overdubs. According to engineer Toby Scott, interviewed by TASCAM, a music-shop clerk sold him a 144. Springsteen’s bedroom demos on it, mixed through an Echoplex onto an old Panasonic boombox, were released as the album Nebraska. Scott says the round knob by the transport keys had been left turned up, so everything was recorded slightly fast: on our unit it is the green PITCH CONTROL."],"go":"b-portastudio","where":"console","img":"assets/G6-tascam-144-hero-01.webp"},{"title":"Technics SL-1200MK2","maker":"Technics (Matsushita), Japan · 1979","year":"","tagline":"The turntable that stopped being just a record player and became a DJ’s instrument.","story":["Technics built the first SL-1200 in 1972 as a hi-fi turntable. In the United States its development team found it working in discos and clubs: DJs were matching beats with its pitch dial and spinning records backwards by hand. The team went to the clubs and asked DJs what they needed. Most of them said: don’t change the controls.","The SL-1200MK2 came out in 1979. The layout stayed the same, but the pitch dial became a vertical slider with a wider range, about ±8%. A quartz lock held the speed exactly, and the direct-drive motor brought the heavy platter to 33⅓ rpm in 0.7 seconds. A small pop-up light lit the stylus in a dark booth.","Clubs made it their standard: a DJ could walk into any booth and find the same deck. Technics says it was the turning point at which its turntables became “musical instruments”. The MK2 stayed in production until 2010; the black version was sold as the SL-1210MK2."],"go":"b-turntable","where":"console","img":"assets/G6-technics-sl-1200mk2-hero-01.webp"}]},{"name":"Audio wall","short":"Wall","pages":[{"title":"McIntosh MC275","maker":"McIntosh Laboratory, Binghamton, USA · 1961; ours from 1970","year":"","tagline":"Two 75-watt tube amplifiers on one chrome chassis: McIntosh’s stereo powerhouse of the 1960s, loved so much that it came back in 1993 and is still made today.","story":["McIntosh Laboratory was founded in 1949 by Frank McIntosh and Gordon Gow, who together designed the “Unity Coupled” output circuit, and moved to Binghamton, New York, in 1951. When stereo records arrived, the company answered with stereo tube amplifiers, and in 1961 came the most powerful of them: the MC275, two 75-watt amplifiers on one chassis; Stereophile credits its design to Sidney Corderman, head of McIntosh engineering.","Everything is out in the open: four KT88 output tubes and seven small tubes stand on polished chrome in front of three black transformers, and the specifications are printed right on the steel. There is no power switch: the amplifier comes on as soon as it gets mains power. It cost $444 on a McIntosh price list of December 1963 and was made by hand, point to point, until transistors took over around 1970.","In 1993 McIntosh brought the MC275 back as a limited edition in memory of Gordon Gow; it sold so well that the company returned to tubes, and the MC275 is still in its catalogue. Ours is an original from 1970 with its first owner’s KT88 tubes, shown without its perforated cage."],"go":"a-receivers","where":"audio wall","img":"assets/G6-mcintosh-mc275-hero-01.webp"},{"title":"Revox A77","maker":"Revox (Willi Studer), Switzerland and West Germany · 1967","year":"","tagline":"The Swiss tape recorder that brought studio-grade open-reel recording into the living room.","story":["Willi Studer made professional tape machines for studios and radio under his own name, and sold home models under a second brand, Revox. In 1967 the tube G36 gave way to the A77: fully transistorised, with three motors on a die-cast aluminium chassis and an electronically regulated capstan motor that held the tape speed.","Everything about it was practical. One POWER lever switched it on and chose the speed, 3¾ or 7½ inches per second. Big 10½-inch reels held more than three hours of music. Separate record and playback heads let you hear the tape a moment after it was recorded, and a light beam stopped the machine when the tape ran out.","The A77 came as a bare chassis, in a walnut cabinet or in a carrying case with four built-in speakers, in two-track and four-track versions. More than 460,000 were built before the B77 took over. Ours is a MkIII in a walnut cabinet with a carrying handle."],"go":"a-reel-to-reel","where":"audio wall","img":"assets/G6-revox-a77-hero-01.webp"},{"title":"TEAC A-4010S","maker":"TEAC, Tokyo · 1968","year":"","tagline":"The Japanese deck that played both sides of a tape without turning the reels over.","story":["TEAC grew out of two small Tokyo companies run by the brothers Katsuma and Tomoma Tani, who set out in the 1950s to build a better tape recorder than the hand-made one Tomoma had brought home. Open-reel decks became their main line, and the A-4010 of 1968 was one of the biggest hits: TEAC counts more than 200,000 sold.","The A-4010S is a deck for serious home listening. Three motors drive it: one for the capstan and one for each reel. It has four separate heads, among them a second playback head for the reverse direction. When the tape reaches its end, the deck can simply play the other two tracks in the reverse direction, so a whole tape plays through without turning the reels over. Four pushbuttons, all worked by solenoids, run the transport.","Below the transport sits the AR-40S amplifier with two big VU meters. People used these machines to record FM radio onto 7-inch reels. Ours is an A-4010S with walnut side panels with aluminium reels."],"go":"a-reel-to-reel-2","where":"audio wall","img":"assets/G6-teac-a-4010-hero-01.webp"}]},{"name":"Video","short":"Video","pages":[{"title":"JVC HR-3300 (Victor HR-3300)","maker":"JVC (Victor), Japan · 1976","year":"","tagline":"The very first VHS video recorder: two hours of television on one cassette, loaded from the top by hand.","story":["In 1971 a small team at JVC’s Yokohama plant, led by Shizuo Takano and Yuma Shiraishi, set out to build a video recorder for the home. They wrote down what it had to do: be cheap, simple, easy to make and repair, and record two hours on one cassette. The result was VHS, the Video Home System, and its first machine was the HR-3300, announced on 9 September 1976 and on sale in Japan from 31 October for ¥256,000.","Everything is mechanical and done by hand. Press EJECT and the cassette holder rises with its aluminium lid; drop the cassette in, push it down, press PLAY and the piano key stays down while the reels turn behind the smoked window and the three-digit counter runs. To take it out, press STOP, then EJECT. The two big knobs tune VHF and UHF channels; the red clock on the left is the RT-3300 video timer, sold separately, which could record one programme while you were out.","Sony’s Betamax had come first, in 1975, but held one hour. JVC licensed VHS to other makers, and within a few months other Japanese companies sold VHS machines; Betamax lost the “format war”. In 1977 the HR-3300 went abroad, as the JVC HR-3300U in America. Ours is a Japanese Victor HR-3300 with its timer fitted, shown with a cassette playing and no television: here you hear it, not see it."],"go":"a-video-deck","where":"audio wall","img":"assets/G6-jvc-hr-3300-hero-01.webp"},{"title":"Maxell Epitaxial T-120 VHS","maker":"Hitachi Maxell, Japan · around 1982","year":"","tagline":"A blank two-hour VHS tape from Hitachi Maxell’s Epitaxial line, in the silver pinstriped sleeve with the red, green and blue band.","story":["Two hours of recording was one of JVC’s goals for VHS, and the first VHS recorder, the Victor HR-3300 of 1976, recorded 120 minutes on one T-120 tape. “T-120” names exactly that: 120 minutes at the standard speed. Hitachi Maxell, the Japanese battery and tape maker, sold VHS tapes under the name “Epitaxial”; Japanese Wikipedia says the line was launched in 1978.","Turn the sleeve over and the Japanese table reads: standard speed (標準), 2 hours; three times (3倍), 6 hours. According to Japanese Wikipedia, that three-times mode (EP) came to Japanese recorders in 1979: the tape runs at a third of the speed, so one cassette holds six hours, at the cost of more hiss and weaker sound. The American issue in a closely similar sleeve (a different “120” typeface, black edges on the colour band), dated 1981 by a collectors’ catalogue, lists three speeds instead (SP 120, LP 240 and EP 360 minutes) and 246 m of tape; the middle LP speed, Japanese Wikipedia adds, was made for the US market in 1977 and hardly spread in Japan. In Europe a similar sleeve was sold as the E-120.","This copy is the Japanese issue: the seller says its owner used it from October to December 1982. It comes in a plain cardboard sleeve, not a plastic case, and the cassette slides out to the side. In the showcase it stands spine-out next to the Victor HR-3300, which records at the standard speed only, so on that deck this tape gives exactly two hours, the recording time JVC aimed for. Nearby is the Sony Betamax tape: the format VHS beat."],"go":"a-vhs-media","where":"audio wall","img":"assets/vd/vhs-sleeve-front.webp"}]},{"name":"Players & boomboxes","short":"Boomboxes","pages":[{"title":"Sony Walkman TPS-L2","maker":"Sony, Japan · 1979","year":"","tagline":"The first Walkman: a tape player built to be carried, not set down.","story":["Sony co-founder Masaru Ibuka liked to listen to music on business trips, but the company’s TC-D5 cassette recorder was bulky. He asked for a playback-only stereo version made for walking. In March 1979 engineers reworked the small Pressman recorder used by journalists into a cassette player.","The blue-and-silver TPS-L2 went on sale in Japan on 1 July 1979 for about ¥33,000. Sony expected to sell about 5,000 a month; it sold more than 30,000 in the first two months. Abroad it first carried other names: Soundabout in the US, Stowaway in the UK, Freestyle in Australia and Sweden.","It was made for two. There are two headphone jacks on top, and an orange HOT LINE button: hold it, and the tape turns down while a built-in microphone lets the two listeners talk over the music. In 2025 the Museum of Modern Art in New York put a 1979 TPS-L2 in its exhibition of design turning points."],"go":"c-walkman","where":"cozy corner","img":"assets/G6-sony-tps-l2-hero-01.webp"},{"title":"JVC RC-M90","maker":"JVC, Japan · around 1981","year":"","tagline":"Eight bands, a two-motor logic deck and big woofers: JVC’s flagship boombox, the one on the cover of LL Cool J’s Radio and now in MoMA.","story":["JVC had already made the giant mono RC-550 and the stereo RC-M70 when, around 1981, it brought out its flagship: the RC-M90. About 67 cm wide and 35 cm tall, it carried two big woofers with a tweeter beside each, a radio with eight bands and a cassette deck with two motors and “full logic” control, where light-touch keys work the mechanism electronically instead of moving it directly.","In November 1985 LL Cool J released his debut album Radio on Def Jam, and its cover is a close-up of an RC-M90; the record’s hit was “I Can’t Live Without My Radio”. Collectors still call the M90 one of the most sought-after boomboxes, and in 2014 the Museum of Modern Art in New York added one to its design collection.","Ours is the American RC-M90JW, with English lettering, FM, AM and six shortwave bands, Dolby B and JVC’s own Super ANRS noise reduction, and a mixer for two microphones. It runs on mains or on ten D-size batteries, and the deck window glows when it is on."],"go":"c-boombox-jvc","where":"cozy corner","img":"assets/G6-jvc-rc-m90-hero-01.webp"},{"title":"Sharp GF-777","maker":"Sharp, Osaka · around 1981–82","year":"","tagline":"Six speakers, two tape decks and a microphone with echo: the giant boombox that was a street sound system and a home studio at once.","story":["At the start of the 1980s Japanese makers were racing to build ever bigger portable stereos, and Sharp went furthest. From around 1981 it sold this design in Japan as the GF-909 “The Searcher W”, and abroad as the GF-777: a box about 75 cm wide and 38 cm tall, weighing 12 to 14 kg before the ten D-size batteries go in. The Henry Ford museum calls it “an exercise in excess” and one of the largest boomboxes ever made.","In American cities it became part of early hip-hop. According to The Henry Ford, it appears on the back cover of Run-DMC’s first album, in music videos and in photos of breakdancing crews. Its two decks made it a cheap home studio: with pause and record you could loop a short piece of music into a beat, a “pause tape”, and a microphone input with built-in echo let you rap or sing over it.","Ours is an export GF-777 for 120, 220 or 240 volts, with FM, AM and two shortwave bands, shown with its grilles off: the chrome rings, the ribbed “combs” on the big woofers and the domed caps of the mid-range speakers are all visible. Deck 1 only plays; deck 2 records, so one tape can be copied onto another."],"go":"c-boombox-sharp","where":"cozy corner","img":"assets/G6-sharp-gf-777-hero-01.webp"}]},{"name":"Amplifiers","short":"Guitar","pages":[{"title":"Fender Twin Reverb","maker":"Fender, Fullerton, California · 1963; ours from 1965","year":"","tagline":"Two 12-inch speakers, 85 clean watts and a spring reverb: the amp that stood behind half the stages of the sixties.","story":["The Twin is one of Fender’s oldest amps. It first appeared at the 1952 NAMM show as a nameless “Hi Fidelity” amp with two 12-inch Jensen speakers and 25 watts, and grew louder through the fifties. In late summer 1963 Fender gave it a spring reverb, black Tolex, a silver grille and a black control panel, and named it the Twin Reverb.","It has two channels. Normal has volume, treble, middle and bass. Vibrato adds reverb and a pulsing effect that Fender calls vibrato, though it really makes the volume rise and fall. Four big 6L6GC tubes give 85 watts into two 12-inch speakers. Fender historians John Teagle and John Sprung call it “possibly the quintessential combo amp”; players chose it for a loud tone that stays clean.","In January 1965 CBS bought Fender, and the panel lettering changed from “Fender Electric Instruments” to “Fender Musical Instruments”. Ours is one of those: a 1965 blackface with an FMI panel. In autumn 1967 the black panel gave way to brushed aluminium, and the “blackface” years were over."],"go":"a-amp-fender","where":"audio wall","img":"assets/G6-fender-twin-reverb-hero-01.webp"},{"title":"Ampeg SVT","maker":"Ampeg, USA · 1969; ours from about 1974","year":"","tagline":"Three hundred watts, fourteen tubes and a fridge-sized cabinet: the bass amp built for the first arena tours.","story":["In 1969 rock moved into arenas and festivals, and 50 or 100 watts was no longer enough. Ampeg’s designers Bill Hughes and Roger Cox, helped by Bob Rufkahr and Dan Armstrong, set out to build what Cox called “the biggest and nastiest bass amplifier the world had ever seen”. They named it the Super Vacuum Tube, SVT: 300 watts from fourteen tubes, at a time when most amps could not reach 100.","Before it was even in production, the prototypes went on the road. Rehearsing in Hollywood for their 1969 American tour, the Rolling Stones plugged their British Fender amps into the wrong mains voltage. Their road manager Ian Stewart called Ampeg’s Rich Mandella, who brought the SVT prototypes; Keith Richards, Mick Taylor and Bill Wyman played everything through them, and Mandella toured with the band to keep the amps alive. The SVT was shown to the public at the 1969 NAMM show in Chicago.","Ours is a “Black Line” SVT from about 1974: black lines and lettering on the silver panel instead of the first blue ones, six 6550 power tubes, and a plate on the back reading “The Ampeg Company, Division of the Magnavox Company”, since Magnavox owned Ampeg from 1971. It stands on its own 8×10 cabinet: eight 10-inch speakers in one tall box. Ampeg meant the head to drive two of these."],"go":"a-amp-svt","where":"audio wall","img":"assets/G6-ampeg-svt-hero-01.webp"}]}],"about":{"toc":"About this site","kick":"Collection journal","title":"About this site","tagline":"A non-commercial fan showcase of analogue music gear.","paras":["RockShowcase is a showcase room put together by a fan of tape, vinyl and tubes. There are no ads, no sales and no donations: the site sells nothing and asks for nothing.","The room and the objects were drawn by an AI image model from photos of real examples. They are illustrations, not photographs, so small details may differ from the originals.","Nakamichi, TASCAM, TEAC, Technics, McIntosh, Revox, JVC, Sony, Sharp, Fender, Ampeg, Maxell and TDK are trademarks of their respective owners. The album covers of Nebraska and Born to Run (Bruce Springsteen), Ten (Pearl Jam) and Nevermind (Nirvana) belong to the artists and their record companies. This site is not affiliated with or endorsed by any of the brand owners or publishers.","The albums on cassette and vinyl play as 30-second previews streamed straight from Apple’s servers: the recordings themselves are not stored on this site. All the other machine sounds were made specially for the site.","The facts in the stories were checked against the sources listed below."],"sourcesH":"Sources","back":"← Back to contents","sources":[{"title":"Bruce Springsteen — Nebraska (cassette)","links":[{"url":"https://en.wikipedia.org/wiki/Nebraska_(album)","what":"Wikipedia, 'Nebraska (album)', revision 1380170074, read 2026-11-07 (only verbatim-checked text used)"},{"url":"https://api.discogs.com/releases/1308419","what":"Discogs release 1308419 (US cassette TCT 38358): credits, barcode, notes; web page blocks robots, API read"}]},{"title":"Pearl Jam — Ten (cassette)","links":[{"url":"https://en.wikipedia.org/wiki/Ten_(Pearl_Jam_album)","what":"Wikipedia, 'Ten (Pearl Jam album)', revision 1383726170, read 2026-11-07 via the MediaWiki API (plain text, every fact checked verbatim)"},{"url":"https://api.discogs.com/releases/933536","what":"Discogs release 933536 (US cassette ZT 47857): credits, barcode, format, studio notes; read via API"}]},{"title":"Maxell XLII-S 90","links":[{"url":"https://www.maxell.eu/company-profile-maxell-europe-ltd/","what":"Maxell Europe, company profile, read 2026-11-09 (curl): Maxell (Japan) a leader since 1961; business began with dry cell batteries; name from \"maximum capacity dry cell\" - company's own text"},{"url":"https://www.analogplanet.com/node/125482","what":"Leslie Shapiro, \"Tale of the Tape: Spotlight on Maxell, the Origin of the Blown-Away Guy...\", Analog Planet, 21 Oct 2024, read 2026-11-09 (curl): founded 1960 as a division of Nitto Electric Industrial; UD series 1974; Blown-Away Guy created 1979 by Scali, McCabe, Sloves for Maxell's US division, photo by Steve Steigman"},{"url":"https://www.soundandvision.com/content/maxell-audio-amp-video-tape","what":"Steve Guttenberg, \"Maxell Audio & Video Tape\", Sound & Vision, 2 Aug 2012, read 2026-11-09 (curl): Blown Away Guy campaign started 1979, JBL L100 speaker; Hitachi Maxell founded in Osaka in 1961; entered the Japanese tape market in 1966"},{"url":"https://tapes.fans/catalog/category/compact-cassette/maxell","what":"tapes.fans, Maxell compact cassette list, read 2026-11-09 (curl): brand note (founded 1960 inside Nitto Denko, split off 1961, Hitachi Maxell 1964); all XLII-S entries by year - collectors' catalogue, secondary"},{"url":"https://tapes.fans/catalog/cassettes/7195","what":"tapes.fans entry 7195, XLII-S 90, 1980, USA, read 2026-11-09 (curl): photo of the black \"High Epitaxial\" J-card and its back (2 dB over UD-XLII in high frequencies, QL Quin-Lok clamp and hub) - secondary"},{"url":"https://tapes.fans/catalog/cassettes/6046","what":"tapes.fans entry 6046, XLII-S 90, 1980, Europe, read 2026-11-09 (curl): the same black \"High Epitaxial\" J-card, European issue - secondary"},{"url":"https://tapes.fans/catalog/cassettes/7214","what":"tapes.fans entry 7214, XLII-S 60, 1982, USA, read 2026-11-09 (curl): gold \"Super Fine Epitaxial\" US package, back text identical to ours (60 min version) - secondary"},{"url":"https://tapes.fans/catalog/cassettes/16245","what":"tapes.fans entry 16245, XLII-S 90, 1983, USA, read 2026-11-09 (curl): front identical to ours; other photos in the entry show a later IEC TYPE II CrO2 card - secondary"},{"url":"https://en.wikipedia.org/wiki/Maxell","what":"Wikipedia, Maxell: hint only (founding date 1960, Nitto split) - nothing taken from it alone"}]},{"title":"TDK SA-X90","links":[{"url":"https://www.tdk.c
