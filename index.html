<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1714">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>RockShowcase</title>
<style>
  :root { --bg:#1b1714; --glow:255,206,140; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; }
  body { -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #scene { position:fixed; inset:0; overflow:hidden; background:var(--bg); }
  .frame { position:absolute; opacity:0; will-change:transform, opacity; }
  .frame.on { opacity:1; }
  .frame img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* «вписать целиком»: поля по краям — размытая та же картинка, а не чёрные полосы */
  body.fit-contain #scene::before { content:""; position:absolute; inset:-40px; background:var(--bg-img, none) center/cover; filter:blur(28px) brightness(.45); }
  .zones { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .zone { fill:rgba(var(--glow),0); stroke:rgba(var(--glow),0); stroke-width:2.5px; vector-effect:non-scaling-stroke; stroke-linejoin:round; cursor:pointer; transition:fill .25s, stroke .25s; }
  @media (hover:hover) { .zone:hover { fill:rgba(var(--glow),.07); stroke:rgba(var(--glow),.55); filter:drop-shadow(0 0 6px rgba(var(--glow),.8)); } }
  .zone:active { fill:rgba(var(--glow),.12); }
  #scene.moving .zone, #scene.moving ~ #edges { pointer-events:none; }
  #edges .edge { position:fixed; top:0; bottom:0; width:clamp(28px, 5vw, 64px); cursor:pointer; z-index:2; transition:background .3s; }
  #edges .edge-left { left:0; }  #edges .edge-right { right:0; }
  @media (hover:hover) {
    #edges .edge-left:hover  { background:linear-gradient(to right, rgba(var(--glow),.22), rgba(var(--glow),0)); }
    #edges .edge-right:hover { background:linear-gradient(to left,  rgba(var(--glow),.22), rgba(var(--glow),0)); }
  }
  @media (hover:hover) { .zone.ghost:hover { stroke-dasharray:7 5; } }
  #edges.off { display:none; }
  /* подойти к предмету (8.3): комната отступает в полумрак, предмет — крупно; мимо предмета — назад */
  .frame.on { transition:transform .8s cubic-bezier(.3,.1,.2,1), filter .8s; }
  #scene.near .frame.on { transform:scale(1.15); filter:blur(6px) brightness(.36) saturate(.8); }
  #scene.near .zone { pointer-events:none; }
  #near { position:fixed; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; }
  #near[hidden] { display:none; }
  #near-obj { width:min(94vw, 82vh * 1.5, 1500px); aspect-ratio:3/2; opacity:0; transform:scale(.96); transition:opacity .5s, transform .5s;
    -webkit-mask-image:linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 91%, transparent);
    -webkit-mask-composite:source-in; mask-image:linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 91%, transparent); mask-composite:intersect; }
  #near.on #near-obj { opacity:1; transform:none; }
  #near-obj img { width:100%; height:100%; display:block; object-fit:cover; }
  /* предмет без картинки (пробел 3) — серая коробка, как в болванке */
  #near-obj.ph { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; -webkit-mask-image:none; mask-image:none; }
  .ph-box { width:36%; aspect-ratio:1.5; border-radius:6px; background:linear-gradient(160deg, #9a958f, #5d5955); box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3); }
  .ph-name { color:rgba(255,236,210,.72); font:16px/1.3 Georgia, 'Times New Roman', serif; letter-spacing:.02em; }
  /* предметы с механикой (8.4, devices.js): сцена 3:2 из кадров этапа 7, слои и зоны нажатия в координатах кадра 1536×1024 */
  #near-obj.dev { -webkit-mask-image:linear-gradient(to right, transparent, #000 3%, #000 97%, transparent), linear-gradient(to bottom, transparent, #000 4%, #000 96%, transparent);
    mask-image:linear-gradient(to right, transparent, #000 3%, #000 97%, transparent), linear-gradient(to bottom, transparent, #000 4%, #000 96%, transparent); }
  .stage { position:relative; width:100%; height:100%; overflow:hidden; touch-action:manipulation; }
  .stage img.f { position:absolute; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; display:block; }
  .stage img.f.on { opacity:1; }
  .stage .layer { position:absolute; z-index:5; pointer-events:none; background-repeat:no-repeat; background-size:100% 100%; }
  .stage .layer.rot { transform-origin:50% 50%; }
  .stage canvas.layer { background:none; }
  .stage .press { position:absolute; z-index:6; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; border-radius:3px; }
  .stage .zone { position:absolute; z-index:8; transform:translate(-50%,-50%); min-width:44px; min-height:44px; border:0; padding:0; margin:0;
    background:transparent; cursor:pointer; border-radius:8px; outline:none; transition:box-shadow .25s, background .25s; }
  .stage .zone[hidden] { display:none; }
  @media (hover:hover) { .stage .zone:hover { box-shadow:0 0 0 2px rgba(var(--glow),.5), 0 0 14px rgba(var(--glow),.45); background:rgba(var(--glow),.05); } }
  .stage .zone:focus-visible { box-shadow:0 0 0 2px rgba(var(--glow),.85); }
  .stage .caption { position:absolute; z-index:7; left:50%; bottom:6%; transform:translateX(-50%); background:rgba(20,14,10,.82); color:#f6ead8;
    padding:6px 12px; border-radius:8px; font:14px/1.3 Georgia, 'Times New Roman', serif; opacity:0; transition:opacity .12s; pointer-events:none; white-space:nowrap; }
  .stage .caption.on { opacity:1; }
  body.debug .stage .zone { outline:2px dashed rgba(var(--glow),.9); outline-offset:-2px; }
  /* кассета в руке: маленькая в левом нижнем углу, ходит с посетителем между точками; нажатие — осмотр */
  #hand { position:fixed; z-index:5; left:clamp(14px, 3vw, 40px); bottom:clamp(14px, 3vh, 34px); height:clamp(86px, 17vh, 170px); cursor:pointer;
    transform:rotate(-7deg); transition:transform .25s; filter:drop-shadow(0 12px 18px rgba(0,0,0,.7)); outline:none; }
  #hand[hidden] { display:none; }
  #hand img { height:100%; display:block; border-radius:3px; }
  @media (hover:hover) { #hand:hover { transform:rotate(-3deg) translateY(-6px); } }
  #hand:focus-visible img { box-shadow:0 0 0 2px rgba(var(--glow),.85); }
  /* осмотр INS-00: кассета крупно; нажатие на неё — повернуть, мимо — опустить руку (кассета остаётся в руке) */
  #insp { position:fixed; inset:0; z-index:6; background:rgba(10,7,5,.8); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #insp[hidden] { display:none; }
  .insp-card { perspective:900px; display:flex; align-items:center; justify-content:center; width:min(80vw, 640px); height:66vh; }
  .insp-card img { max-width:100%; max-height:100%; cursor:pointer; box-shadow:0 14px 36px rgba(0,0,0,.65); border-radius:3px; transform-origin:50% 50%; }
  .insp-lbl { color:rgba(255,236,210,.78); font:16px/1.3 Georgia, 'Times New Roman', serif; letter-spacing:.02em; }
  /* осмотр пластинки VIN-00 (8.5): кадр 3:2, места нажатия — на самом конверте и его краях (D-006) */
  .vin-card { display:none; position:relative; width:min(94vw, 1100px, 108vh); aspect-ratio:3/2; perspective:1400px; }
  #insp.vin .vin-card { display:block; }
  #insp.vin .insp-card { display:none; }
  .vin-card img { position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:4px; pointer-events:none; transform-origin:50% 50%; box-shadow:0 14px 36px rgba(0,0,0,.65); }
  .vin-card .zone { position:absolute; z-index:3; transform:translate(-50%,-50%); min-width:44px; min-height:44px; border:0; padding:0; margin:0;
    background:transparent; cursor:pointer; border-radius:8px; outline:none; transition:box-shadow .25s, background .25s; }
  .vin-card .zone[hidden] { display:none; }
  @media (hover:hover) { .vin-card .zone:hover { box-shadow:0 0 0 2px rgba(var(--glow),.5), 0 0 14px rgba(var(--glow),.45); background:rgba(var(--glow),.05); } }
  @media (hover:none) { .vin-card .zone.edge { box-shadow:inset 0 0 0 1.5px rgba(var(--glow),.45); } }
  .vin-card .zone:focus-visible { box-shadow:0 0 0 2px rgba(var(--glow),.85); }
  .insp-hint { color:rgba(255,236,210,.5); font:13px/1.35 Georgia, 'Times New Roman', serif; text-align:center; max-width:min(92vw, 900px); padding:0 16px; }
  .insp-hint:empty { display:none; }
  .stage .zone.quiet { cursor:default; }
  @media (hover:hover) { .stage .zone.quiet:hover { box-shadow:none; background:transparent; } }
  #hand .disc { height:100%; aspect-ratio:1; border-radius:50%; background-repeat:no-repeat; }
  #hand img[hidden], #hand .disc[hidden] { display:none; }
  /* цепочки 3–5 на A (8.6, devices-a.js): MC275, катушечники, видео; «крупно» — наезд, мимо — назад */
  .stage .hero { position:absolute; inset:0; transform-origin:0 0; }
  .stage .hero > img, .stage .hero > canvas { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  .stage .hero > img.mcglow { mix-blend-mode:plus-lighter; opacity:0; }
  .stage .hero > img.cage { inset:auto; height:auto; }
  .stage .heat { position:absolute; pointer-events:none; opacity:0; background-repeat:no-repeat; filter:url(#rsHeat);
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 30%,transparent 68%); mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 30%,transparent 68%); }
  .stage .pview { position:absolute; inset:0; z-index:10; opacity:0; pointer-events:none; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 60%,#2a1c12,#0d0907 75%); }
  .stage .pview.on { pointer-events:auto; }
  .stage .pview ~ .caption { z-index:11; }
  .stage .pbox { position:relative; width:100%; }
  .stage .pbox > img, .stage .pbox > canvas { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  .stage .pbox > img.kn { inset:auto; height:auto; }
  .stage .pview .zone { z-index:3; }
  .stage .shelfpic { position:absolute; top:0; height:100%; left:27.78%; width:44.44%; pointer-events:none; }
  .stage .shelfpic img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .stage.dark { background:radial-gradient(ellipse at 50% 55%,#3a2a1e,#120c08 80%); }
  .vhs-card { display:none; position:relative; width:min(94vw, 1100px, 108vh); aspect-ratio:3/2; perspective:1400px; }
  #insp.vhs .vhs-card { display:block; }
  #insp.vhs .insp-card, #insp.vhs .vin-card { display:none; }
  .vhs-card .vc { position:absolute; inset:0; transform-origin:50% 50%; }
  .vhs-card img { position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:4px; pointer-events:none; box-shadow:0 14px 36px rgba(0,0,0,.65); }
  .vhs-card .zone { position:absolute; z-index:3; transform:translate(-50%,-50%); min-width:44px; min-height:44px; border:0; padding:0; margin:0;
    background:transparent; cursor:pointer; border-radius:8px; outline:none; transition:box-shadow .25s, background .25s; }
  .vhs-card .zone[hidden] { display:none; }
  @media (hover:hover) { .vhs-card .zone:hover { box-shadow:0 0 0 2px rgba(var(--glow),.5), 0 0 14px rgba(var(--glow),.45); background:rgba(var(--glow),.05); } }
  @media (hover:none) { .vhs-card .zone.edge { box-shadow:inset 0 0 0 1.5px rgba(var(--glow),.45); } }
  #hand .vhs { height:100%; aspect-ratio:1.96; border-radius:3px; background-repeat:no-repeat; }
  #hand .vhs[hidden] { display:none; }
  /* угол C (8.7, devices-c.js): кассета бумбокса в руке и осмотр сторон A / B */
  .bb-card { display:none; position:relative; width:min(94vw, 960px, 108vh); aspect-ratio:3/2; perspective:1400px; }
  #insp.bb .bb-card { display:block; }
  #insp.bb .insp-card, #insp.bb .vin-card, #insp.bb .vhs-card { display:none; }
  .bb-card .vc { position:absolute; inset:0; transform-origin:50% 50%; }
  .bb-card img { position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:4px; pointer-events:none; box-shadow:0 14px 36px rgba(0,0,0,.65); }
  .bb-card .zone { position:absolute; z-index:3; transform:translate(-50%,-50%); border:0; padding:0; margin:0; background:transparent; cursor:pointer; border-radius:8px; outline:none; }
  #hand img.bb { aspect-ratio:3/2; object-fit:cover; }
  /* истории STO-00 (8.7): кадры 9.7 (D-209) — столик с радио и журналом, шкала светится, разворот; подписи шкалы, стрелка, метка ручки и закладка — кодом */
  .stage.story { container-type:inline-size; background:#160e09; font-family:Georgia, 'Times New Roman', serif; }
  .stage.story img.st-lit { transition:opacity .45s ease-out; }
  .stage.story.on img.st-lit { opacity:1; }
  .st-dial { position:absolute; overflow:hidden; border-radius:.4cqw; }
  /* шкала узкая (кадр 9.7): риски всех тем внизу, имя выбранной темы — одно, по центру сверху */
  .st-scale b { position:absolute; bottom:12%; width:.14cqw; height:22%; margin-left:-.07cqw; font-size:0; background:rgba(240,205,140,.3); transition:background .45s, height .3s; }
  .stage.story.on .st-scale b { background:rgba(70,30,6,.65); }
  .stage.story.on .st-scale b.on { background:#4a0c04; height:34%; }
  .st-name { position:absolute; left:4%; right:4%; top:14%; text-align:center; font:700 1.05cqw/1.1 Georgia, serif; letter-spacing:.06em; text-transform:uppercase;
    color:transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .45s; }
  .stage.story.on .st-name { color:#4a0c04; text-shadow:0 0 .4cqw rgba(255,225,150,.9); }
  .st-needle { position:absolute; top:6%; bottom:6%; width:.22cqw; margin-left:-.11cqw; background:#a3241c; box-shadow:0 0 .3cqw rgba(0,0,0,.6); }
  .st-knob { position:absolute; border-radius:50%; }
  .st-knob i { position:absolute; left:50%; top:9%; width:.32cqw; height:24%; margin-left:-.16cqw; border-radius:.16cqw; background:rgba(40,22,8,.85); box-shadow:0 0 .15cqw rgba(255,220,150,.5); }
  .st-over { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .st-over .st-cover { fill:none; stroke:none; }
  .st-over.call .st-cover { animation:stCall 1.6s infinite; }
  @keyframes stCall { 50% { stroke:rgba(var(--glow),.85); stroke-width:6px; filter:drop-shadow(0 0 10px rgba(var(--glow),.8)); } }
  .st-ribbons line { stroke:transparent; stroke-width:13px; stroke-linecap:round; transition:stroke .4s; }
  .st-ribbons line.on { stroke:rgba(190,36,24,.82); }
  .stage.story .caption { z-index:10; }
  .st-spread { position:absolute; z-index:9; }
  .st-spread[hidden] { display:none; }
  .st-pg { position:absolute; color:#3b2a1d; padding:3.2cqw 3.6cqw 3cqw; display:flex; flex-direction:column; min-height:0; box-sizing:border-box; }
  .st-pg.r { align-items:center; justify-content:center; gap:1.4cqw; }
  .st-kick { font:600 1.05cqw/1 system-ui, sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#8a6a4a; margin-bottom:1cqw; }
  .st-pg h3 { margin:0; font:700 2.5cqw/1.12 Georgia, serif; }
  .st-by { font:italic 1.25cqw/1.3 Georgia, serif; color:#7a5a3a; margin:.5cqw 0 1cqw; }
  .st-tag { margin:0 0 1.2cqw; font:italic 1.45cqw/1.35 Georgia, serif; color:#5a3a20; }
  .st-txt { flex:1; min-height:0; overflow:auto; font:1.3cqw/1.5 Georgia, serif; padding-right:.8cqw; overscroll-behavior:contain; }
  .st-txt p { margin:0 0 .9cqw; }
  .st-folio { position:absolute; left:3.6cqw; bottom:1.2cqw; font:1cqw/1 system-ui, sans-serif; color:#8a6a4a; letter-spacing:.1em; }
  .st-ph { width:84%; height:66%; display:flex; align-items:center; justify-content:center; border-radius:.5cqw; background:radial-gradient(ellipse at 50% 40%,#e9dcc0,#cdb991); }
  #near-obj .st-ph img { width:auto; height:auto; max-width:92%; max-height:92%; object-fit:contain; display:block; border-radius:.3cqw; box-shadow:0 1.2cqw 2cqw rgba(0,0,0,.45); }
  #near-obj .st-ph img[hidden] { display:none; }
  .st-empty { width:46%; aspect-ratio:3/2; border:.2cqw dashed rgba(90,58,32,.45); border-radius:.6cqw; display:flex; align-items:center; justify-content:center; font:italic 1.2cqw Georgia, serif; color:#8a6a4a; }
  .st-empty[hidden] { display:none; }
  .st-act { font:italic 1.3cqw/1.35 Georgia, serif; color:#6a4a2a; text-align:center; max-width:84%; }
  .st-toc { display:none; }
  .st-spread.toc .st-ph, .st-spread.toc .st-act { display:none; }
  .st-spread.toc .st-toc { display:flex; flex-direction:column; width:84%; gap:.4cqw; }
  .st-tocline { display:flex; justify-content:space-between; gap:2cqw; border:0; border-bottom:.12cqw dotted #b49870; background:transparent; color:#3b2a1d; cursor:pointer;
    font:1.7cqw/1.6 Georgia, serif; padding:.4cqw .2cqw; text-align:left; }
  .st-tocline em { font-style:normal; color:#8a6a4a; }
  @media (hover:hover) { .st-tocline:hover { color:#a3241c; } }
  /* язык сайта (9.9): строчка внизу оглавления журнала */
  .st-lang { margin-top:1.6cqw; text-align:center; font:1.25cqw/1.4 Georgia, serif; color:#8a6a4a; }
  .st-lang button { border:0; background:transparent; padding:.3cqw .4cqw; font:inherit; color:#3b2a1d; cursor:pointer; text-decoration:underline dotted #b49870; text-underline-offset:.3cqw; }
  .st-lang button.on { color:#8a6a4a; text-decoration:none; cursor:default; font-weight:700; }
  @media (hover:hover) { .st-lang button:not(.on):hover { color:#a3241c; } }
  @media (pointer:coarse) { .st-lang { font-size:1.6cqw; } .st-lang button { padding:1cqw 1.2cqw; } }
  /* «об этом сайте» (10.4): строчка в оглавлении, источники мелко под текстом */
  .st-tocline.st-about { margin-top:.8cqw; border-bottom-style:solid; font-style:italic; }
  .st-srch { margin:1.4cqw 0 .6cqw; font:600 1.05cqw/1 system-ui, sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#8a6a4a; }
  .st-src { margin:0 0 .8cqw; font:1.05cqw/1.4 Georgia, serif; }
  .st-src b { display:block; color:#3b2a1d; }
  .st-src a { display:block; color:#6a4a2a; text-decoration:underline dotted #b49870; text-underline-offset:.2cqw; overflow-wrap:anywhere; }
  @media (hover:hover) { .st-src a:hover { color:#a3241c; } }
  @media (pointer:coarse) { .st-src { font-size:1.4cqw; } .st-src a { padding:.3cqw 0; } }
  .st-spread .zone { z-index:3; }
  .st-spread .zone.edge { border-radius:0; }
  /* усилители (8.8, devices-amp.js): общий кадр, панель крупно, задняя планка — слои превью 7.27 */
  .stage.amp-st { background:#000; }
  .amp-st .amp { position:absolute; inset:0; }
  .amp-st .view { position:absolute; inset:0; opacity:0; pointer-events:none; transform-origin:0 0; }
  .amp-st .view.on { opacity:1; pointer-events:auto; }
  #near-obj .amp-st .view > img, #near-obj .amp-st .apbox > img { position:absolute; display:block; pointer-events:none; user-select:none; object-fit:fill; }
  #near-obj .amp-st img.full { inset:0; width:100%; height:100%; }
  .amp-st .v-panel { display:flex; align-items:center; background:radial-gradient(ellipse at 50% 55%,#2a1c12,#0b0806 78%); }
  .amp-st .apbox { position:relative; width:100%; aspect-ratio:3/1; }
  #near-obj .amp-st img.lay { opacity:0; }
  #near-obj .amp-st img.lay.vis, #near-obj .amp-st img.knob { opacity:1; }
  .amp-st .knob { transition:transform .15s ease-out; }
  .amp-st .bright { position:absolute; background-repeat:no-repeat; pointer-events:none; transition:transform .06s; }
  .amp-st .zone[data-z="unplug"], .amp-st .zone[data-z="power"], .amp-st .zone[data-z^="pedal"] { z-index:9; }
  .amp-st .caption { z-index:10; }
  /* телефон (8.10, D-199): комнату и сцены водят пальцем; долгое нажатие подсвечивает всё, что нажимается */
  #scene, #edges, #near, #insp, .stage { touch-action:none; -webkit-touch-callout:none; }
  #near-obj { flex:none; }
  .st-txt { touch-action:pan-y; } /* текст статьи прокручивается пальцем сам */

ь Fender Twin Reverb","home":"VP-A","image":"assets/G6-fender-twin-reverb-hero-01.webp","size":[1536,1024]},"a-amp-svt":{"name":"Басовый усилитель Ampeg SVT","home":"VP-A","image":"assets/G6-ampeg-svt-hero-01.webp","size":[1536,1024]},"c-radio":{"name":"Радиоприёмник","home":"VP-C","image":"assets/G9-story-off-01.webp","size":[1535,1024]},"c-bookshelf":{"name":"Полка с журналами","home":"VP-C"},"c-boombox-jvc":{"name":"Бумбокс JVC RC-M90","home":"VP-C","image":"assets/G6-jvc-rc-m90-hero-01.webp","size":[1536,1024]},"c-boombox-sharp":{"name":"Бумбокс Sharp GF-777","home":"VP-C","image":"assets/G6-sharp-gf-777-hero-01.webp","size":[1536,1024]},"c-walkman":{"name":"Плеер Sony Walkman TPS-L2","home":"VP-C","image":"assets/G6-sony-tps-l2-hero-01.webp","size":[1536,1024]},"c-cartridges":{"name":"Игровые картриджи","home":"VP-C"}},"stories":[{"name":"Кассеты","short":"Кассеты","pages":[{"title":"Брюс Спрингстин — Nebraska (кассета)","maker":"Columbia, США · 1982","year":"","tagline":"Домашнее демо рок-звезды на четырёхдорожечной кассете, выпущенное почти таким, каким было записано.","story":["Зимой 1981 года Брюс Спрингстин отправил своего гитарного техника купить простой магнитофон. С 17 декабря 1981 по 3 января 1982 года он один записывал новые песни в спальне своего дома в Колтс-Нек, Нью-Джерси, — на четырёхдорожечную кассетную портастудию TEAC 144 и два микрофона Shure SM57.","Записи задумывались как черновики для E Street Band. Он носил кассету в кармане джинсов, не зная, что с ней делать. В версиях с группой дух черновиков пропал, и акустические записи выпустили как есть. Чтобы перенести их на винил, понадобилось около двух месяцев работы; окончательный мастер сделали в Atlantic Studios в Нью-Йорке.","Columbia выпустила Nebraska 30 сентября 1982 года. Спрингстин не давал интервью и не ездил с ним в тур, но альбом поднялся до третьего места в США и Великобритании, а к 1989 году стал платиновым. Перед вами оригинальная американская кассета, каталожный номер TCT 38358."],"cas":0,"img":"assets/cas/ins-front.webp"},{"title":"Pearl Jam — Ten (кассета)","maker":"Epic Associated, США · 1991","year":"","tagline":"Дебют Pearl Jam, родившийся из демокассеты, которая ходила между Сиэтлом и Сан-Диего.","story":["Pearl Jam начались с плёнки. Когда в 1990 году умер вокалист Эндрю Вуд и группа Mother Love Bone распалась, Стоун Госсард, Джефф Амент и Майк Маккриди записали инструментальные демо и пустили по рукам кассету Stone Gossard Demos '91, надеясь найти певца и барабанщика. В сентябре 1990 года её копию получил от барабанщика Джека Айронса Эдди Ведер, музыкант из Сан-Диего. Он послушал, пошёл сёрфить, а на следующий день написал тексты к трём песням. Две из них стали «Alive» и «Once».","В октябре Ведер прилетел в Сиэтл и неделю репетировал с группой — за это время они написали одиннадцать песен. Ещё под названием Mookie Blaylock, в честь баскетболиста, весной 1991 года они записали альбом в London Bridge Studios в Сиэтле с продюсером Риком Парашаром, а в июне Тим Палмер свёл его в студии Ridge Farm в Англии. После контракта с Epic группа стала Pearl Jam и назвала альбом по номеру на майке Блейлока: десять.","Ten вышел 27 августа 1991 года и поначалу продавался медленно. Группа почти не слезала с гастролей, и к концу 1992 года альбом поднялся до второго места в Billboard 200. К февралю 1993 года в США его купили больше, чем Nevermind группы Nirvana, а сейчас у него 13 платиновых сертификатов. Перед вами оригинальная американская кассета Epic Associated ZT 47857 в полностью прозрачном кейсе."],"cas":1,"img":"assets/cas/ins-front-ten.webp"},{"title":"Maxell XLII-S 90 (чистая кассета)","maker":"Maxell, Япония · около 1982–1983","year":"","tagline":"Кассета Maxell позиции High (Type II) начала 1980-х, по словам самой Maxell — лучше её же UD-XLII; бронзово-золотой вкладыш.","story":["Maxell начиналась с батареек: имя — сокращение от «maximum capacity dry cell», «сухой элемент максимальной ёмкости». Компания появилась в Японии около 1960–61 года из батарейного и плёночного производства фирмы Nitto Electric и вскоре стала Hitachi Maxell. В 1979 году американское отделение запустило рекламу, которую журнал Sound & Vision назвал самой культовой аудиорекламой всех времён, — «Сдутого парня» (Blown Away Guy): человека в кресле буквально сдувает звук колонки JBL. Снимок сделал фотограф Стив Стейгман для агентства Scali, McCabe, Sloves.","UD-XLII — кассета Maxell «хромовой» позиции (Type II), а XLII-S продавали как ступеньку выше. Каталог коллекционеров записывает первую XLII-S около 1980 года, в чёрном вкладыше с надписью «High Epitaxial»; её оборот обещал на 2 дБ больше на высоких частотах, чем у UD-XLII, и новый зажим и хаб «Quin-Lok». Перед вами следующая версия — «Super Fine Epitaxial» в бронзово-золотом вкладыше. На обороте написано, что новые частицы поднимают максимальный уровень и отдачу на 1 дБ во всём диапазоне частот и снижают шум подмагничивания на 0,5 дБ — тоже в сравнении с UD-XLII, — и представлен механизм PA (Phase Accuracy): прижимная подушка EP (Exact Pressure), прокладка HP (Hexagonal Pattern) и хаб из двух частей.","Это американский тираж: сделано в Японии, на обороте подпись Maxell Corporation of America из Мунаки, Нью-Джерси; спереди «POSITION HIGH», по 45 минут на сторону, 135 м ленты. Каталог коллекционеров датирует эту американскую упаковку 1982–83 годами. В витрине она стоит рядом с TDK SA-X — две японские кассеты-соперницы одних лет, те самые чистые кассеты, на которые записывали альбом, радиоэфир или сборник для друга."],"cas":2,"img":"assets/cas/ins-front-xlii-s.webp"},{"title":"TDK SA-X90 (чистая кассета)","maker":"TDK, Япония · около 1982","year":"","tagline":"Флагманская кассета TDK «хромовой» позиции начала 1980-х: два магнитных слоя на одной ленте, японская упаковка в чёрном и золоте.","story":["TDK основали в Токио в 1935 году под именем Tokyo Denki Kagaku Kogyo, чтобы делать феррит — магнитный материал, незадолго до того изобретённый в Токийском технологическом институте. Потом компания выпустила первую японскую кассетную ленту, и, по словам самой TDK, её марку узнали во всём мире; кассета SD, как пишет компания, летала даже на «Аполлоне-11». В 1973 году TDK объявила о новом магнитном порошке Avilyn, а в 1975 году улучшенный вариант попал в музыкальную кассету SA, которую TDK называла первой в мире кассетой «хромовой» позиции без хрома.","SA-X — ступенька выше SA. Вместо одного магнитного слоя на ленте два слоя из двух видов Avilyn с разными магнитными свойствами, как объясняет по-японски оборот этого вкладыша: вкладыш обещает максимальный уровень выше, чем у SA, и низкий шум, а маленький график на нём показывает кривую SA-X выше кривой SA. В корпусе стоит механизм SP (Super Precision) с фирменной прижимной подушкой на двух пружинах — про него и надпись спереди «Super Precision Cassette Mechanism». Когда SA-X появилась впервые, источники расходятся: рекламный портрет компании TDK в журнале Audio 1984 года называет 1981 год, а каталог коллекционеров записывает японскую SA-X C90 уже в 1979-й.","В 1982 году TDK рекламировала в США обновлённые ленты серии Professional Reference — MA-R, SA-X и AD-X — в новой яркой упаковке. Перед вами японская SA-X90, которую каталог коллекционеров датирует 1982 годом: чёрный вкладыш с золотой сеткой, «High Position» для дек с переключателем типа ленты, по 45 минут на сторону. На обороте ещё стоит имя Tokyo Denki Kagaku Kogyo; в TDK компания переименовалась в 1983 году, так что вкладыш, скорее всего, напечатан раньше. В витрине это та самая чистая кассета, которую покупали, чтобы записать любимый альбом — свой или друга."],"cas":3,"img":"assets/cas/ins-front-sa-x.webp"}]},{"name":"Винил","short":"Винил","pages":[{"title":"Брюс Спрингстин — Born to Run (пластинка)","maker":"Columbia, США · 1975","year":"","tagline":"Третий альбом, на который Спрингстин поставил всё и стал звездой: восемь песен, две студии и обложка, за которую Columbia заплатила вдвое.","story":["Первые два альбома Брюса Спрингстина на Columbia хвалили, но не покупали, и третий провал мог стоить ему контракта. Он месяцами искал один большой звук. Заглавную песню записали в 914 Sound Studios в Блаувельте, штат Нью-Йорк, остальные семь записали, свели и смастерили в Record Plant на Манхэттене — так написано на обороте конверта. Работа затянулась настолько, что, как вспоминает Спрингстин, «Born to Run» крутили по радио за несколько месяцев до того, как альбом был готов.","Для обложки фотограф Эрик Мейола за один день снял около 900 кадров; запомнился тот, где Спрингстин, улыбаясь, опирается на плечо саксофониста Кларенса Клемонса. Арт-директор Джон Берг хотел, чтобы снимок переходил с лица на оборот, а для этого нужен конверт-разворот. Обычный конверт стоил в производстве 25 центов, такой — 50, и развороты Columbia делала только для двойных альбомов: Берг вспоминает неделю переговоров.","Альбом вышел в конце августа 1975 года по рекомендованной цене 6,98 доллара, через несколько недель стал золотым, в октябре поднялся до третьего места в США, и в том же месяце Спрингстин оказался на обложках Time и Newsweek. Сейчас он семикратно платиновый и внесён в Национальный реестр звукозаписей Библиотеки Конгресса. Перед вами оригинальная пластинка 1975 года PC 33795 с завода в Санта-Марии; на её конверте имя сопродюсера уже напечатано верно — «Jon Landau»: на самых первых конвертах его написали с ошибкой."],"go":"a-vinyl-rows","where":"аудиостена, вид A","img":"assets/vin/ins-front-btr.webp"},{"title":"Nirvana — Nevermind (пластинка)","maker":"DGC, европейское издание · 1991","year":"","tagline":"Первый альбом трио из Сиэтла на большом лейбле, который сбросил Майкла Джексона с первого места: двенадцать песен, месяц в Sound City и младенец, плывущий за долларом.","story":["Ради Nevermind, альбома для DGC, лейбла Geffen, Курт Кобейн, Крист Новоселич и Дэйв Грол поехали с продюсером Бутчем Вигом в Sound City Studios в Ван-Найсе, Калифорния. Запись и сведение заняли чуть больше месяца; изначальный бюджет, по данным Mental Floss, — 65 тысяч долларов. Виг вспоминает, что группа жила в квартире, где царил хаос, до рассвета пропадала на Венис-Бич и приходила в студию часам к четырём дня. Свёл пластинку Энди Уоллес в студии Scream в Студио-Сити, мастеринг сделал Хоуи Вайнберг в Masterdisk в Нью-Йорке.","Идею обложки — младенец под водой тянется к деньгам — придумали Кобейн и арт-директор Geffen Роберт Фишер. Чтобы не платить за готовый снимок из фотобанка, лейбл нанял фотографа Кирка Уэддла, и тот снимал в бассейне в Пасадене: четырёхмесячного сына своих друзей, ни разу до того не бывавшего в воде, сфотографировали камерой, стоявшей на штативе под водой. Долларовую купюру на рыболовном крючке добавили к снимку потом. «Купюра делает кадр», — говорил позже Уэддл.","Nevermind вышел в США 24 сентября 1991 года и вошёл в Billboard 200 на 144-м месте. На волне «Smells Like Teen Spirit» он 27 ноября 1991 года в один день стал золотым и платиновым, а в чарте от 11 января 1992 года поднялся на первое место, сменив там Dangerous Майкла Джексона. Сейчас RIAA сертифицировала его как 13-кратно платиновый, и он внесён в Национальный реестр звукозаписей Библиотеки Конгресса. Перед вами европейская пластинка 1991 года, отпечатанная в Харлеме, с печатным внутренним конвертом, на котором фото обезьяны напечатано вверх ногами."],"go":"a-vinyl-rows","where":"аудиостена, вид A","img":"assets/vin/ins-front-nvm.webp"}]},{"name":"Консоль","short":"Консоль","pages":[{"title":"Nakamichi Dragon","maker":"Nakamichi, Япония · 1982–1993","year":"","tagline":"Кассетная дека, которая слушает плёнку и сама поворачивает головку под неё.","story":["В ноябре 1982 года Nakamichi выпустила в Северной Америке новую флагманскую деку за 1850 долларов. Это была Dragon — трёхголовочная дека и первая у фирмы, которая играет кассету в обе стороны, не переворачивая её.","У автореверса была слабость: кассета, записанная на другом аппарате, редко точно совпадает с воспроизводящей головкой, и страдают высокие частоты. Dragon решила это системой NAAC — автоматической коррекцией азимута Nakamichi. Пока кассета играет, маленький мотор наклоняет головку, пока две половины сигнала не совпадут. Пока система работает, стрелки над окошком мигают.","Обозреватели назвали её лучшей декой из всех, что они проверяли, и она стала эталоном для остальных. Название придумал основатель фирмы Эцуро Накамити, умерший в месяц её выхода. Оригинальная Dragon выпускалась до 1993 года."],"go":"b-cassette-deck","where":"консоль, вид B","img":"assets/G6-nakamichi-dragon-hero-01.webp"},{"title":"TEAC 144 Portastudio","maker":"TEAC / TASCAM, Токио · 1979","year":"","tagline":"Четырёхдорожечная студия в одном ящике: микшер и обычная кассета — и песню можно было собрать дома, слой за слоем.","story":["До конца 1970-х, чтобы записать одну партию поверх другой, нужна была студия или громоздкий катушечный магнитофон. 22 сентября 1979 года на выставке AES в Нью-Йорке профессиональная линия TEAC — TASCAM — показала 144 Portastudio, которую сама называет первым в мире четырёхдорожечным кассетным рекордером. Четырёхканальный микшер и кассетная дека жили в одном корпусе весом около 9 кг: записываешь гитару, рядом голос, потом третью и четвёртую партию — и сводишь всё в стерео, не вставая с кровати.","Хитрость была в плёнке. 144 гоняла обычную кассету вдвое быстрее нормы и занимала четырьмя дорожками всю ширину ленты, поэтому кассета играла только в одну сторону. TASCAM вспоминает, что первые наброски нарисовали на салфетке в ресторане; цена в её истории — 899 долларов, в других местах называют 1100 долларов рекомендованной цены 1979 года.","В конце 1981 года Брюс Спрингстин послал своего гитарного техника найти «маленький магнитофон» для наложений. По словам звукорежиссёра Тоби Скотта в интервью для TASCAM, продавец музыкального магазина продал ему 144. Домашние демо Спрингстина на ней, сведённые через эхо Echoplex на старый бумбокс Panasonic, вышли альбомом Nebraska. Скотт рассказывает, что круглую ручку у клавиш транспорта оставили повёрнутой вверх, и всё записалось чуть быстрее: у нашего экземпляра это зелёная PITCH CONTROL."],"go":"b-portastudio","where":"консоль, вид B","img":"assets/G6-tascam-144-hero-01.webp"},{"title":"Technics SL-1200MK2","maker":"Technics (Matsushita), Япония · 1979","year":"","tagline":"Проигрыватель, который перестал быть просто проигрывателем и стал инструментом диджея.","story":["Первый SL-1200 Technics выпустила в 1972 году как проигрыватель для ценителей звука. В США разработчики увидели его в дискотеках и клубах: диджеи подгоняли темп ручкой pitch и крутили пластинки назад руками. Команда пошла по клубам и спросила диджеев, что им нужно. Большинство ответили: не меняйте управление.","SL-1200MK2 вышел в 1979 году. Расположение органов управления осталось прежним, но ручку pitch заменил вертикальный ползунок с большим диапазоном, около ±8 %. Кварцевая стабилизация держала скорость точно, а двигатель с прямым приводом разгонял тяжёлый диск до 33⅓ оборота за 0,7 секунды. Маленькая выдвижная лампа подсвечивала иглу в тёмной кабине.","Клубы сделали его стандартом: диджей мог прийти в любую кабину и найти там тот же проигрыватель. Technics называет его поворотным моментом, когда её проигрыватели стали «музыкальными инструментами». MK2 выпускали до 2010 года; чёрную версию продавали как SL-1210MK2."],"go":"b-turntable","where":"консоль, вид B","img":"assets/G6-technics-sl-1200mk2-hero-01.webp"}]},{"name":"Аудиостена","short":"Стена","pages":[{"title":"McIntosh MC275","maker":"McIntosh Laboratory, Бингемтон, США · 1961; наш — 1970 года","year":"","tagline":"Два 75-ваттных ламповых усилителя на одном хромированном шасси: стереомощь McIntosh 1960-х, которую так любили, что в 1993 году её вернули, и выпускают до сих пор.","story":["McIntosh Laboratory основали в 1949 году Фрэнк Макинтош и Гордон Гоу — вместе они придумали выходную схему «Unity Coupled», — а в 1951 году фирма переехала в Бингемтон, штат Нью-Йорк. Когда появились стереопластинки, McIntosh ответила стереоусилителями на лампах, и в 1961 году вышел самый мощный из них — MC275: два усилителя по 75 Вт на одном шасси; журнал Stereophile называет его автором Сидни Кордермана, главу инженеров McIntosh.","Всё на виду: четыре выходные лампы KT88 и семь маленьких стоят на полированном хроме перед тремя чёрными трансформаторами, а характеристики напечатаны прямо на стали. Выключателя нет: усилитель включается, как только на него подают сеть. По прайс-листу McIntosh декабря 1963 года он стоил 444 доллара и собирался вручную, навесным монтажом, пока около 1970 года транзисторы не вытеснили лампы.","В 1993 году McIntosh вернула MC275 ограниченной серией в память о Гордоне Гоу; она разошлась так хорошо, что фирма снова взялась за лампы, и MC275 до сих пор есть в её каталоге. Наш экземпляр — оригинал 1970 года с лампами KT88 первого владельца, показан без перфорированного кожуха."],"go":"a-receivers","where":"аудиостена, вид A","img":"assets/G6-mcintosh-mc275-hero-01.webp"},{"title":"Revox A77","maker":"Revox (Вилли Штудер), Швейцария и ФРГ · 1967","year":"","tagline":"Швейцарский магнитофон, который принёс студийную катушечную запись в гостиную.","story":["Вилли Штудер делал профессиональные магнитофоны для студий и радио под своим именем, а домашние модели продавал под второй маркой — Revox. В 1967 году ламповый G36 сменил A77: полностью на транзисторах, три двигателя на литом алюминиевом шасси и ведущий двигатель с электронной стабилизацией, который держал скорость плёнки.","Всё в нём было продумано для дела. Один рычаг POWER включал аппарат и выбирал скорость — 9,5 или 19 см/с. На большие катушки 26,5 см помещалось больше трёх часов музыки. Отдельные головки записи и воспроизведения позволяли слышать плёнку через мгновение после записи, а луч света останавливал аппарат, когда плёнка кончалась.","A77 выпускали голым шасси, в ореховом корпусе и в чемодане с четырьмя встроенными динамиками, в двух- и четырёхдорожечном вариантах. До прихода B77 сделали больше 460 000 штук. Наш — MkIII в ореховом корпусе с ручкой для переноски."],"go":"a-reel-to-reel","where":"аудиостена, вид A","img":"assets/G6-revox-a77-hero-01.webp"},{"title":"TEAC A-4010S","maker":"TEAC, Токио · 1968","year":"","tagline":"Японская дека, которая играла обе стороны плёнки, не переворачивая катушки.","story":["TEAC выросла из двух маленьких токийских компаний братьев Кацумы и Томомы Тани. В 1950-х они взялись сделать магнитофон лучше самодельного, который Томома принёс домой. Катушечные деки стали их главным делом, и A-4010 1968 года — одна из самых успешных: TEAC насчитывает больше 200 000 проданных.","A-4010S — дека для серьёзного домашнего прослушивания. Её крутят три двигателя: один ведущий вал и по одному на каждую катушку. Головок четыре, отдельных, среди них вторая головка воспроизведения для обратного хода. Когда плёнка доходит до конца, дека просто играет две другие дорожки в обратную сторону, и вся плёнка звучит, не переворачивая катушки. Механизмом управляют четыре клавиши, все через электромагниты.","Под механизмом — усилитель AR-40S с двумя большими стрелочными индикаторами. На такие аппараты записывали FM-радио на катушки 18 см. Наш — A-4010S с ореховыми боками и алюминиевыми катушками."],"go":"a-reel-to-reel-2","where":"аудиостена, вид A","img":"assets/G6-teac-a-4010-hero-01.webp"}]},{"name":"Видео","short":"Видео","pages":[{"title":"JVC HR-3300 (Victor HR-3300)","maker":"JVC (Victor), Япония · 1976","year":"","tagline":"Самый первый видеомагнитофон VHS: два часа телевидения на одной кассете, которую кладут сверху руками.","story":["В 1971 году небольшая группа на заводе JVC в Иокогаме во главе с Сидзуо Таканой и Юмой Сираиси взялась сделать видеомагнитофон для дома. Они выписали, каким он должен быть: недорогим, простым, лёгким в производстве и ремонте, и записывать два часа на одну кассету. Так появился VHS (Video Home System), а его первым аппаратом стал HR-3300: его представили 9 сентября 1976 года, а 31 октября он поступил в продажу в Японии за 256 000 иен.","Всё здесь механическое и делается руками. Нажмёшь EJECT — держатель кассеты поднимается вместе с алюминиевой крышкой; кладёшь кассету, прижимаешь вниз, нажимаешь PLAY — клавиша остаётся утопленной, за дымчатым окошком крутятся катушки, бежит трёхзначный счётчик. Чтобы достать кассету, сначала STOP, потом EJECT. Две большие ручки настраивают каналы VHF и UHF, а красные часы слева — это видеотаймер RT-3300, который продавался отдельно и мог записать одну передачу, пока хозяев нет дома.","Betamax фирмы Sony вышел раньше, в 1975 году, но вмещал один час. JVC разрешила делать VHS другим фирмам, и уже через несколько месяцев VHS-аппараты продавали другие японские компании; «войну форматов» Betamax проиграл. В 1977 году HR-3300 поехал за границу — в Америке он назывался JVC HR-3300U. Наш экземпляр — японский Victor HR-3300 с установленным таймером, показан с играющей кассетой и без телевизора: здесь его слушают, а не смотрят."],"go":"a-video-deck","where":"аудиостена, вид A","img":"assets/G6-jvc-hr-3300-hero-01.webp"},{"title":"Maxell Epitaxial T-120 (чистая видеокассета VHS)","maker":"Hitachi Maxell, Япония · около 1982","year":"","tagline":"Чистая двухчасовая кассета VHS из линейки Epitaxial фирмы Hitachi Maxell — в серебристом футляре в полоску с красной, зелёной и синей лентой.","story":["Двухчасовая запись была одной из целей JVC при создании VHS, и первый видеомагнитофон VHS, Victor HR-3300 1976 года, записывал на одну кассету T-120 120 минут. «T-120» ровно это и значит: 120 минут на стандартной скорости. Hitachi Maxell, японский производитель батареек и плёнки, продавала кассеты VHS под именем «Epitaxial»; японская Википедия пишет, что линейку выпустили в 1978 году.","Переверните футляр — японская таблица: стандартная скорость (標準) — 2 часа, «в три раза» (3倍) — 6 часов. По японской Википедии, этот трёхкратный режим (EP) пришёл в японские магнитофоны в 1979 году: лента идёт втрое медленнее, на кассету помещается шесть часов, но шипит сильнее и звук хуже. Американский тираж в очень похожем футляре (другой шрифт «120», чёрная кайма у цветной полосы; каталог коллекционеров датирует его 1981 годом) указывает три скорости — SP 120, LP 240 и EP 360 минут — и 246 м ленты; среднюю скорость LP, по той же Википедии, сделали для американского рынка в 1977 году, в Японии она почти не распространилась. В Европе похожий футляр продавали как E-120.","Перед вами японский тираж: по словам продавца, владелец пользовался кассетой с октября по декабрь 1982 года. Она в простом картонном футляре, а не в пластиковом кейсе, и выдвигается вбок. В витрине она стоит корешком рядом с Victor HR-3300, который записывает только на стандартной скорости, — на этой деке кассета даёт ровно два часа — время записи, к которому стремилась JVC. Неподалёку — кассета Sony Betamax: формат, который VHS победил."],"go":"a-vhs-media","where":"аудиостена, вид A","img":"assets/vd/vhs-sleeve-front.webp"}]},{"name":"Плееры и бумбоксы","short":"Бумбоксы","pages":[{"title":"Sony Walkman TPS-L2","maker":"Sony, Япония · 1979","year":"","tagline":"Первый Walkman: кассетный плеер, который носят с собой, а не ставят на полку.","story":["Сооснователь Sony Масару Ибука любил слушать музыку в деловых поездках, но кассетный магнитофон фирмы TC-D5 был громоздким. Он попросил сделать стереоверсию только для воспроизведения, чтобы слушать на ходу. В марте 1979 года инженеры переделали в плеер маленький диктофон Pressman, с которым работали журналисты.","Сине-серебристый TPS-L2 поступил в продажу в Японии 1 июля 1979 года, примерно за 33 000 иен. Sony рассчитывала продавать около 5000 штук в месяц, а за первые два месяца продала больше 30 000. За границей он сначала назывался иначе: Soundabout в США, Stowaway в Великобритании, Freestyle в Австралии и Швеции.","Он был рассчитан на двоих. Сверху два гнезда для наушников и оранжевая кнопка HOT LINE: пока её держишь, музыка становится тише, а встроенный микрофон даёт двоим слушателям поговорить. В 2025 году Музей современного искусства в Нью-Йорке показал TPS-L2 1979 года на выставке о поворотных моментах в дизайне."],"go":"c-walkman","where":"уютный угол, вид C","img":"assets/G6-sony-tps-l2-hero-01.webp"},{"title":"JVC RC-M90","maker":"JVC, Япония · около 1981","year":"","tagline":"Восемь диапазонов, дека с двумя моторами и логикой, большие вуферы: флагманский бумбокс JVC — тот, что на обложке «Radio» LL Cool J, а теперь и в MoMA.","story":["JVC уже выпустила гигантский монофонический RC-550 и стерео RC-M70, когда около 1981 года показала свой флагман — RC-M90. Шириной около 67 см и высотой 35 см, он нёс два больших вуфера с твитером рядом с каждым, радио на восемь диапазонов и деку с двумя моторами и «полной логикой»: лёгкие клавиши управляют механизмом через электронику, а не двигают его рукой.","В ноябре 1985 года LL Cool J выпустил на Def Jam свой первый альбом «Radio», и на его обложке крупным планом — RC-M90; хитом пластинки стала «I Can't Live Without My Radio». Коллекционеры до сих пор называют M90 одним из самых желанных бумбоксов, а в 2014 году Музей современного искусства в Нью-Йорке взял его в свою коллекцию дизайна.","Наш экземпляр — американский RC-M90JW с английскими подписями, FM, AM и шестью коротковолновыми диапазонами, шумоподавлением Dolby B и фирменным Super ANRS и микшером на два микрофона. Работает от сети или от десяти батареек D, а окошко деки при включении светится."],"go":"c-boombox-jvc","where":"уютный угол, вид C","img":"assets/G6-jvc-rc-m90-hero-01.webp"},{"title":"Sharp GF-777","maker":"Sharp, Осака · около 1981–1982","year":"","tagline":"Шесть динамиков, две деки и микрофон с эхом: гигантский бумбокс, который был и уличной акустикой, и домашней студией.","story":["В начале 1980-х японские фирмы соревновались, кто сделает переносную стереосистему больше, и дальше всех зашла Sharp. Примерно с 1981 года этот бумбокс продавали в Японии как GF-909 «The Searcher W», а за границей — как GF-777: ящик шириной около 75 см и высотой 38 см, весом 12–14 кг ещё без десяти больших батареек D. Музей The Henry Ford называет его «упражнением в избыточности» и одним из самых больших бумбоксов в истории.","В американских городах он стал частью раннего хип-хопа. По словам The Henry Ford, он есть на задней обложке первого альбома Run-DMC, в клипах и на фотографиях брейк-данс-команд. Две деки делали его дешёвой домашней студией: паузой и записью можно было закольцевать короткий кусок музыки в бит — «pause tape», — а вход для микрофона со встроенным эхом позволял читать рэп или петь поверх.","Наш экземпляр — экспортный GF-777 на 120, 220 или 240 вольт, с FM, AM и двумя коротковолновыми диапазонами, и решётки с него сняты: видны хромированные кольца, ребристые «гребёнки» больших вуферов и колпаки средних динамиков. Первая дека только играет, вторая записывает — так одну кассету можно переписать на другую."],"go":"c-boombox-sharp","where":"уютный угол, вид C","img":"assets/G6-sharp-gf-777-hero-01.webp"}]},{"name":"Усилители","short":"Гитара","pages":[{"title":"Fender Twin Reverb","maker":"Fender, Фуллертон, Калифорния · 1963; наш — 1965 года","year":"","tagline":"Два динамика по 12 дюймов, 85 чистых ватт и пружинный ревербератор: комбик, который стоял за спиной у половины сцен шестидесятых.","story":["Twin — один из старейших усилителей Fender. Он появился на выставке NAMM в 1952 году как безымянный усилитель «Hi Fidelity» с двумя динамиками Jensen по 12 дюймов и мощностью 25 ватт и в пятидесятые становился всё громче. В конце лета 1963 года Fender дала ему пружинный ревербератор, чёрный винил Tolex, серебристую решётку и чёрную панель и назвала Twin Reverb.","Каналов два. В Normal — громкость, высокие, средние и низкие. В Vibrato к ним добавлены ревербератор и пульсирующий эффект, который Fender называет вибрато, хотя на деле это волны громкости. Четыре крупные лампы 6L6GC дают 85 ватт на два 12-дюймовых динамика. Историки Fender Джон Тигл и Джон Спрунг называют его, возможно, главным комбиком вообще; музыканты брали его за громкий звук, который остаётся чистым.","В январе 1965 года Fender купила CBS, и надпись на панели сменилась с «Fender Electric Instruments» на «Fender Musical Instruments». Наш — как раз такой: blackface 1965 года с панелью FMI. Осенью 1967 года чёрную панель сменил шлифованный алюминий, и годы «blackface» закончились."],"go":"a-amp-fender","where":"аудиостена, вид A","img":"assets/G6-fender-twin-reverb-hero-01.webp"},{"title":"Ampeg SVT","maker":"Ampeg, США · 1969; наш — около 1974 года","year":"","tagline":"Триста ватт, четырнадцать ламп и кабинет размером с холодильник: басовый усилитель, сделанный для первых гастролей по стадионам.","story":["В 1969 году рок переехал на стадионы и фестивали, и 50 или 100 ватт уже не хватало. Конструкторы Ampeg Билл Хьюз и Роджер Кокс с помощью Боба Руфкара и Дэна Армстронга взялись сделать, по словам Кокса, «самый большой и злой басовый усилитель на свете». Его назвали Super Vacuum Tube — SVT: 300 ватт на четырнадцати лампах, когда большинство усилителей не дотягивало и до 100.","Ещё до выпуска прототипы уехали на гастроли. На репетициях в Голливуде перед американским туром 1969 года Rolling Stones включили свои британские усилители Fender не в то напряжение сети. Их тур-менеджер Иэн Стюарт позвонил Ричу Манделле из Ampeg, и тот привёз прототипы SVT; Кит Ричардс, Мик Тейлор и Билл Уаймен играли через них всё, а Манделла ездил с группой и следил, чтобы усилители не сгорели. Публике SVT показали на выставке NAMM 1969 года в Чикаго.","Наш SVT — «Black Line» примерно 1974 года: на серебристой панели чёрные линии и надписи вместо первых синих, шесть выходных ламп 6550, а на задней табличке — «The Ampeg Company, Division of the Magnavox Company»: с 1971 года Ampeg принадлежала Magnavox. Он стоит на родном кабинете 8×10 — восемь 10-дюймовых динамиков в одном высоком ящике. По замыслу Ampeg голова должна была работать на два таких."],"go":"a-amp-svt","where":"аудиостена, вид A","img":"assets/G6-ampeg-svt-hero-01.webp"}]}],"about":{"toc":"Об этом сайте","kick":"Журнал коллекции","title":"Об этом сайте","tagline":"Некоммерческая фан-витрина аналоговой музыкальной техники.","paras":["RockShowcase — комната-витрина, которую собрал любитель плёнки, винила и ламп. Здесь нет рекламы, продаж и сбора денег: сайт ничего не продаёт и ни о чём не просит.","Комната и предметы нарисованы нейросетью по фотографиям настоящих экземпляров. Это иллюстрации, а не снимки: мелкие детали могут отличаться от оригинала.","Nakamichi, TASCAM, TEAC, Technics, McIntosh, Revox, JVC, Sony, Sharp, Fender, Ampeg, Maxell и TDK — товарные знаки их владельцев. Обложки альбомов Nebraska и Born to Run (Bruce Springsteen), Ten (Pearl Jam) и Nevermind (Nirvana) принадлежат исполнителям и их звукозаписывающим компаниям. Сайт не связан с владельцами марок и издателями и не одобрен ими.","Альбомы на кассетах и пластинках играют 30-секундные отрывки прямо с сервера Apple: сами записи на сайте не хранятся. Остальные звуки аппаратов сделаны для сайта.","Факты в историях сверены с источниками — они перечислены ниже."],"sourcesH":"Источники","back":"← К оглавлению","sources":[{"title":"Брюс Спрингстин — Nebraska (кассета)","links":[{"url":"https://en.wikipedia.org/wiki/Nebraska_(album)","what":"Wikipedia, 'Nebraska (album)', revision 1380170074, read 2026-11-07 (only verbatim-checked text used)"},{"url":"https://api.discogs.com/releases/1308419","what":"Discogs release 1308419 (US cassette TCT 38358): credits, barcode, notes; web page blocks robots, API read"}]},{"title":"Pearl Jam — Ten (кассета)","links":[{"url":"https://en.wikipedia.org/wiki/Ten_(Pearl_Jam_album)","what":"Wikipedia, 'Ten (Pearl Jam album)', revision 1383726170, read 2026-11-07 via the MediaWiki API (plain text, every fact checked verbatim)"},{"url":"https://api.discogs.com/releases/933536","what":"Discogs release 933536 (US cassette ZT 47857): credits, barcode, format, studio notes; read via API"}]},{"title":"Maxell XLII-S 90 (чистая кассета)","links":[{"url":"https://www.maxell.eu/company-profile-maxell-eur
